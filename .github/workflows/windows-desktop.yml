name: windows-desktop

on:
  push:
    branches: [Windows]
    paths: ["windows/**", ".github/workflows/windows-desktop.yml"]
  pull_request:
    branches: [Windows]
    paths: ["windows/**"]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.100"

      - name: Restore Windows solution
        run: dotnet restore windows/OpenMono.Windows.sln

      - name: Build libraries and tests
        run: >
          dotnet build windows/OpenMono.Windows.sln -c Release --no-restore
          --exclude-design-time-facets

      - name: Unit tests
        run: dotnet test windows/tests/OpenMono.Windows.Tests/OpenMono.Windows.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish desktop app (self-contained win-x64)
        run: >
          dotnet publish windows/src/OpenMono.Desktop/OpenMono.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -o windows/publish/win-x64 /p:Version=$((Get-Content windows/VERSION.windows).Trim())

      - name: Stage models.json and version
        run: |
          Copy-Item windows/src/OpenMono.Models/models.json windows/publish/win-x64 -Force
          Copy-Item windows/VERSION.windows windows/publish/win-x64 -Force

      - name: Optional code signing (skipped without cert)
        if: env.WINDOWS_CERT_PATH != ''
        env:
          WINDOWS_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = $env:WINDOWS_CERT_PATH
          if ($pfx -and (Test-Path $pfx)) {
            Get-ChildItem windows/publish/win-x64 -Include *.exe, *.dll -Recurse | ForEach-Object {
              signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            }
          } else {
            Write-Host "No signing cert provided, skipping signing."
          }

      - name: Compile installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/installer/inno/openmono.iss

      - name: Smoke test (supervisor headless vs stub server)
        run: dotnet run --project windows/src/OpenMono.SmokeTest/OpenMono.SmokeTest.csproj -c Release --no-build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMonoSetup
          path: dist/OpenMonoSetup.exe
