name: windows-desktop

on:
  push:
    branches: [Windows]
    paths: ["windows/**", ".github/workflows/windows-desktop.yml"]
  pull_request:
    branches: [Windows]
    paths: ["windows/**"]
  workflow_dispatch:

jobs:
  # Portable net10.0 libraries + tests run on Linux so Windows UI work cannot
  # silently change ports, tiers, or the shell tool. WinUI (Desktop) stays on
  # the windows-latest job below.
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.100"

      - name: Build portable libraries (no WinUI)
        # NOTE: the audit-code list uses %3B (MSBuild unescapes it to ';').
        # A literal ';' would split the -p switch into two properties and
        # fail with MSB1006. WarningsNotAsErrors flows as a global property so
        # the upstream-owned NuGet audit advisories (NU1902/1903 on ImageSharp
        # via src/OpenMono.Cli, which this branch may not edit) do not fail
        # restore under TreatWarningsAsErrors. Compiler warnings stay errors.
        run: |
          dotnet build windows/src/OpenMono.Hardware/OpenMono.Hardware.csproj -c Release -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.Models/OpenMono.Models.csproj -c Release -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.Supervisor/OpenMono.Supervisor.csproj -c Release -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.AgentHost/OpenMono.AgentHost.csproj -c Release -p:WarningsNotAsErrors="NU1902%3BNU1903"

      - name: Unit tests
        run: dotnet test windows/tests/OpenMono.Windows.Tests/OpenMono.Windows.Tests.csproj -c Release --logger "console;verbosity=normal" -p:WarningsNotAsErrors="NU1902%3BNU1903"

  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.100"

      - name: Restore Windows solution
        # -r win-x64 restores the win-x64 assets graph for every project in
        # the solution, including src/OpenMono.Cli (referenced by Desktop).
        # Without it, msbuild /t:Publish /p:RuntimeIdentifier=win-x64 fails
        # with NETSDK1047 on the referenced project. Declaring
        # RuntimeIdentifiers on Desktop alone is not enough.
        run: dotnet restore windows/OpenMono.Windows.sln -r win-x64 -p:WarningsNotAsErrors="NU1902%3BNU1903"

      - name: Add VS msbuild to PATH
        # PRI packaging tasks (ExpandPriContent) ship only with Visual Studio
        # MSBuild, not the dotnet SDK: dotnet build of the WinUI project fails
        # with MSB4062. The image carries VS2026 + UWP/MSIX workloads, so VS
        # msbuild resolves them from the VS install. dotnet still builds and
        # tests everything else; only Desktop uses VS msbuild.
        uses: microsoft/setup-msbuild@v2

      - name: Build libraries and tests
        run: |
          dotnet build windows/src/OpenMono.Hardware/OpenMono.Hardware.csproj -c Release --no-restore -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.Models/OpenMono.Models.csproj -c Release --no-restore -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.Supervisor/OpenMono.Supervisor.csproj -c Release --no-restore -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.AgentHost/OpenMono.AgentHost.csproj -c Release --no-restore -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/tests/OpenMono.Windows.Tests/OpenMono.Windows.Tests.csproj -c Release --no-restore -p:WarningsNotAsErrors="NU1902%3BNU1903"
          dotnet build windows/src/OpenMono.SmokeTest/OpenMono.SmokeTest.csproj -c Release --no-restore -p:WarningsNotAsErrors="NU1902%3BNU1903"
          msbuild windows/src/OpenMono.Desktop/OpenMono.Desktop.csproj /p:Configuration=Release /p:Platform=x64 /p:WarningsNotAsErrors="NU1902%3BNU1903" /m /v:minimal

      - name: Unit tests
        run: dotnet test windows/tests/OpenMono.Windows.Tests/OpenMono.Windows.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish desktop app (self-contained win-x64)
        # VS msbuild for the same PRI reason as the build step above.
        run: >
          msbuild windows/src/OpenMono.Desktop/OpenMono.Desktop.csproj /t:Publish
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true /p:Version=$((Get-Content windows/VERSION.windows).Trim())
          /p:PublishDir="windows\publish\win-x64\"
          /p:WarningsNotAsErrors="NU1902%3BNU1903"

      - name: Stage models.json and version
        run: |
          Copy-Item windows/src/OpenMono.Models/models.json windows/publish/win-x64 -Force
          Copy-Item windows/VERSION.windows windows/publish/win-x64 -Force

      - name: Optional code signing (skipped without cert)
        if: env.WINDOWS_CERT_PATH != ''
        env:
          WINDOWS_CERT_PATH: ${{ secrets.WINDOWS_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = $env:WINDOWS_CERT_PATH
          if ($pfx -and (Test-Path $pfx)) {
            Get-ChildItem windows/publish/win-x64 -Include *.exe, *.dll -Recurse | ForEach-Object {
              signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            }
          } else {
            Write-Host "No signing cert provided, skipping signing."
          }

      - name: Compile installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/installer/inno/openmono.iss

      - name: Smoke test (supervisor headless vs stub server)
        run: dotnet run --project windows/src/OpenMono.SmokeTest/OpenMono.SmokeTest.csproj -c Release --no-build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMonoSetup
          path: windows/dist/OpenMonoSetup.exe
