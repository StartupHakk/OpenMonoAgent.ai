# Windows-only CI for the `win` branch. Not present on `main`.
# Builds the win/ solution, runs the GPU-free unit tests, and parse-checks
# the PowerShell host scripts under both PowerShell 7 and Windows
# PowerShell 5.1, runs the openmono.ps1 smoke test with fake tools, and
# (non-blocking) checks the live llama.cpp release and model ladder URLs.
# llama.cpp and the GGUF models are never downloaded.
name: win

on:
  push:
    branches: [win]
    paths: ['win/**', '.github/workflows/win.yml', '.gitattributes', 'docker/**', 'src/**', 'scripts/models.json']
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build win solution
        run: dotnet build win/OpenMono.Win.sln -c Release
      - name: Test win solution
        run: dotnet test win/OpenMono.Win.sln -c Release --no-build

  # The agent that runs in the Linux container and talks to the host's
  # llama-server through host.docker.internal.
  # ResolveBaseUrl_EmptyHostOs_StillKeepsLiteralDockerGatewayName needs
  # /.dockerenv (it only passes inside a container), so it is skipped here.
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Agent tests
        run: dotnet test src/OpenMono.Tests -c Release --filter "FullyQualifiedName!~ResolveBaseUrl_EmptyHostOs_StillKeepsLiteralDockerGatewayName"

  # Live check that the newest llama.cpp release still ships the CUDA,
  # Vulkan and CPU Windows x64 zips, and that every GGUF in the Windows
  # ladder still downloads (HEAD only). Informational: an upstream change or
  # an outage must not block the branch.
  models-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: openmono-win models check
        env:
          OPENMONO_WIN_REPO: ${{ github.workspace }}
        run: |
          dotnet build win/src/OpenMono.Win.Launcher -c Release
          dotnet win/src/OpenMono.Win.Launcher/bin/Release/net10.0/openmono-win.dll models check

  # The real thing on a GPU-less Windows runner: openmono.ps1 installs the
  # newest llama.cpp CPU build, downloads the CPU rung GGUF and projector
  # (cached between runs), starts llama-server.exe, and win/tests/live
  # checks a chat, the agent's read_file tool round trip, an image, reuse
  # across PowerShell 7 and 5.1, and stop. Non-blocking: it depends on
  # GitHub and Hugging Face downloads and a shared CPU.
  llama-live:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      OPENMONO_MODELS_DIR: ${{ github.workspace }}\.live-models
      OPENMONO_LLAMA_CPP_DIR: ${{ runner.temp }}\llama.cpp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: .live-models
          key: win-live-models-${{ hashFiles('scripts/models.json') }}
      - name: Live llama.cpp check (PowerShell 7)
        shell: pwsh
        run: ./win/tests/live/llama-live.ps1
      - name: Live llama.cpp check (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File win/tests/live/llama-live.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: llama-server log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:USERPROFILE '.openmono\win\llama-server.log'
          if (Test-Path $log) { Get-Content $log -Tail 80 }

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: win
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Parse-check win PowerShell scripts (pwsh 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem win -Recurse -Filter *.ps1 | ForEach-Object { $_.FullName })
          $check = {
            param($files)
            $bad = 0
            foreach ($f in $files) {
              $errs = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errs) | Out-Null
              foreach ($e in @($errs)) { if ($e) { Write-Host "$f($($e.Extent.StartLineNumber)): $($e.Message)"; $bad++ } }
            }
            $bad
          }
          $pwshErrors = & $check $scripts
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes(
            "`$files = @('" + ($scripts -join "','") + "'); & {" + $check.ToString() + "} `$files"))
          $winpsErrors = [int](powershell.exe -NoProfile -EncodedCommand $encoded | Select-Object -Last 1)
          Write-Host "pwsh parse errors: $pwshErrors; Windows PowerShell 5.1 parse errors: $winpsErrors"
          if ($pwshErrors -ne 0 -or $winpsErrors -ne 0) { exit 1 }
      - name: openmono.ps1 help runs on both shells
        shell: pwsh
        run: |
          pwsh -NoProfile -File win/openmono.ps1 help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File win/openmono.ps1 help
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test openmono.ps1 end to end (pwsh 7)
        shell: pwsh
        run: ./win/tests/smoke/windows-smoke.ps1 -Shell pwsh
      - name: Smoke test openmono.ps1 end to end (Windows PowerShell 5.1)
        shell: pwsh
        run: ./win/tests/smoke/windows-smoke.ps1 -Shell powershell
