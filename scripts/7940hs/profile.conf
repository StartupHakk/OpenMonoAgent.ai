# shellcheck shell=bash
# shellcheck disable=SC2034  # values are read by the scripts that source this file
# ──────────────────────────────────────────────────────────────────────────────
# OpenMono.ai: AMD Ryzen 9 7940HS / Radeon 780M native inference profile
#
# The pinned recipe. Every value can be overridden from the environment when
# running scripts/7940hs/oma-7940hs.sh (same variable name), and the installed
# copy lives in /etc/openmono-7940hs/oma.conf, which the systemd service reads.
#
# Status tags used below:
#   PROVEN   measured on the reference box, keep unless a test beats it
#   TUNING   still being tuned; expect this value to change in a later commit
# ──────────────────────────────────────────────────────────────────────────────

# ── Engine: upstream ggml-org llama.cpp prebuilt, Vulkan (RADV) ──── PROVEN ──
# b12728 Ubuntu Vulkan x64 release. With -ub 512 and the graphics queue env it
# served 17.8 tok/s at 1 user and 24.0 total at 2, vs 16.4 / 22.7 on Unsloth
# b12649 -ub 256 (llama-bench: prefill +18%, decode +7%). sha256 and size are
# the GitHub release asset digest. The tarball has one top-level folder
# (llama-b12728/), stripped on extract. ROCm builds hang or crash on the 780M.
OMA_LLAMA_TAG="${OMA_LLAMA_TAG:-b12728}"
OMA_LLAMA_ASSET="${OMA_LLAMA_ASSET:-llama-b12728-bin-ubuntu-vulkan-x64.tar.gz}"
OMA_LLAMA_URL="${OMA_LLAMA_URL:-https://github.com/ggml-org/llama.cpp/releases/download/${OMA_LLAMA_TAG}/${OMA_LLAMA_ASSET}}"
OMA_LLAMA_SHA256="${OMA_LLAMA_SHA256:-99b1a7a54829fa53964c5db6ab34c5f9a7734fb8029506e55bf3d04e24ba4979}"
OMA_LLAMA_SIZE="${OMA_LLAMA_SIZE:-37107359}"
OMA_LLAMA_STRIP="${OMA_LLAMA_STRIP:-1}"         # tar --strip-components (Unsloth tarballs: 0)

# ── Model: Inkling 2 Mini Q4_0 (bartowski GGUF) ───────────────────── PROVEN ──
# Fastest Q4 in the sweep with the same 40-item score as UD-Q4_K_XL. Full 498
# set with this recipe: 466/498. sha256 is the Hugging Face LFS object id.
OMA_MODEL_REPO="${OMA_MODEL_REPO:-bartowski/Inkling-2-Mini-GGUF}"
OMA_MODEL_FILE="${OMA_MODEL_FILE:-Inkling-2-Mini-Q4_0.gguf}"
OMA_MODEL_URL="${OMA_MODEL_URL:-https://huggingface.co/${OMA_MODEL_REPO}/resolve/main/${OMA_MODEL_FILE}}"
OMA_MODEL_SHA256="${OMA_MODEL_SHA256:-e8a583198523fe1119120061ed68fc3ce14dd1052ef53815014c867b307b9e37}"
OMA_MODEL_SIZE="${OMA_MODEL_SIZE:-15064977088}"
OMA_MODEL_ALIAS="${OMA_MODEL_ALIAS:-Inkling-2-Mini-Q4_0}"

# ── Server flags ──────────────────────────────────────────────────────────────
OMA_PORT="${OMA_PORT:-7474}"                    # same port as every OMA backend
OMA_HOST="${OMA_HOST:-0.0.0.0}"                 # agent container and LAN clients reach it
OMA_PARALLEL="${OMA_PARALLEL:-2}"               # PROVEN: box targets 1 to 2 users
# Context is the TOTAL across slots: 131072 / 2 slots = 64K per slot, sized
# for coding agents. 64K per slot ran at the same speed as 32K, 12/12 quality,
# needles found at 8K/32K/60K, about 4.5 GiB free at idle, 2.5 GiB at worst.
# Do NOT go higher on a 32 GB box with f16 KV: 96K per slot (-c 196608) fell
# under 2 GiB free on a 60K prompt, and 128K per slot (-c 262144) ran the
# kernel out of memory at load (panic "System is deadlocked on memory").
OMA_CTX="${OMA_CTX:-131072}"                    # PROVEN: 2 x 64K
OMA_CACHE_K="${OMA_CACHE_K:-f16}"               # PROVEN: f16 466/498 vs q8_0 464, same speed, +1 GiB
OMA_CACHE_V="${OMA_CACHE_V:-f16}"
OMA_FLASH_ATTN="${OMA_FLASH_ATTN:-on}"          # PROVEN: off costs decode speed
OMA_NGL="${OMA_NGL:-99}"                        # full GPU offload (needs the GTT raise)
OMA_BATCH="${OMA_BATCH:-2048}"                  # PROVEN: 512 to 4096 made no difference
OMA_UBATCH="${OMA_UBATCH:-512}"                 # PROVEN: +18% prefill vs 256 on b12728; 1024 within 1%
OMA_CACHE_RAM="${OMA_CACHE_RAM:-2048}"          # PROVEN: -cram MiB, caps the host prompt cache (empty = llama.cpp default)
OMA_LOAD_MODE="${OMA_LOAD_MODE:-mmap}"          # PROVEN: "none" left less free RAM
OMA_REASONING="${OMA_REASONING:-off}"           # scored runs used thinking off
[ -n "${OMA_TEMPLATE_KWARGS:-}" ] || OMA_TEMPLATE_KWARGS='{"reasoning_effort":"none"}'
OMA_EXTRA_ARGS="${OMA_EXTRA_ARGS:-}"            # TUNING: free-form extra llama-server flags
# PROVEN: the graphics queue gave +7% decode on the 780M (RDNA3). Space
# separated NAME=VALUE pairs; set OMA_ENV_EXTRA=" " to run with none.
OMA_ENV_EXTRA="${OMA_ENV_EXTRA:-GGML_VK_ALLOW_GRAPHICS_QUEUE=1}"

# ── GPU guard ─────────────────────────────────────────────────────────────────
# After the server reports healthy, VRAM + GTT in use must reach this many MiB,
# or the service is failed. Catches silent CPU fallback (seen when the service
# user was not in the render group: 3 to 4 tok/s with the GPU idle).
OMA_GPU_GUARD_MIN_MIB="${OMA_GPU_GUARD_MIN_MIB:-8000}"

# ── Kernel memory window (GTT) ────────────────────────────────────── PROVEN ──
# 28 GiB GTT on a box with 32 GB RAM and the BIOS UMA carve-out set to 512M
# (see README). The model and 2 x 64K f16 KV use about 25 GiB of it. With the
# stock 6 GiB carve-out use 20480 and keep OMA_CTX at 65536. pages = MiB*256.
OMA_GTT_MIB="${OMA_GTT_MIB:-28672}"

# ── Install locations (no home paths) ─────────────────────────────────────────
OMA_PREFIX="${OMA_PREFIX:-/opt/openmono-7940hs}"
OMA_ETC="${OMA_ETC:-/etc/openmono-7940hs}"
OMA_STATE="${OMA_STATE:-/var/lib/openmono-7940hs}"
OMA_MODEL_DIR="${OMA_MODEL_DIR:-${OMA_STATE}/models}"
OMA_KEY_FILE="${OMA_KEY_FILE:-${OMA_ETC}/api-keys}"
OMA_UNIT="${OMA_UNIT:-openmono-7940hs-llama.service}"
OMA_PERF_UNIT="${OMA_PERF_UNIT:-openmono-7940hs-perf.service}"
